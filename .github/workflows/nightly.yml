# The nightly build: every night at 00:00 (Europe/Madrid) the core is built from the default branch with the fit
# recorded in projects/fits.json (no seed is searched for) and published as an artifact, kept for two weeks. The
# artifact is the tree a user copies onto the Pocket's SD card: downloaded, it is the zip to unpack there.
# The job fails, and publishes nothing, if that fit does not close timing with the sources as they are.
#
# It can also be run by hand (Actions > Nightly > Run workflow) on any branch: that branch is built with the seed its
# projects/fits.json records -- a check that a pull request's record closes, when one is wanted.
#
# Quartus comes from a public container image of Quartus Prime Lite 23.1std.1, named by its digest. For this device
# that version places and routes as 25.1std, the one of README.md, does: the same seed gives the same bitstream,
# byte for byte, so a seed found with one is good for the other.
name: Nightly

on:
  schedule:
    # midnight in Madrid, summer and winter time (GitHub may start a scheduled run late)
    - cron: '0 0 * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Europe/Madrid               # the nightly's name carries the day in Madrid
  QUARTUS_IMAGE: docker.io/chriz2600/quartus-lite@sha256:50eac410e54617e93ad6c13d9129f7e52c89108a819ded31e66d1eb4577cd8ef
  QUARTUS_IN_IMAGE: /opt/intelFPGA_lite/23.1/quartus/bin
  MIPS_CC: mips-linux-gnu-gcc-13

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The tools
        run: |
          # room for the image (12 GB unpacked): what the runner carries and this build does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-13-mips-linux-gnu binutils-mips-linux-gnu meson ninja-build
          docker pull -q "$QUARTUS_IMAGE"
          # quartus_sh, as the build calls it: the image's, on this tree at the same path
          mkdir -p "$RUNNER_TEMP/quartus"
          cat > "$RUNNER_TEMP/quartus/quartus_sh" <<'SH'
          #!/bin/sh
          exec docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$QUARTUS_IMAGE" "$QUARTUS_IN_IMAGE/quartus_sh" "$@"
          SH
          chmod +x "$RUNNER_TEMP/quartus/quartus_sh"
          echo "QUARTUS_BIN=$RUNNER_TEMP/quartus" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/quartus/quartus_sh" --version
          df -h / | tail -1

      - name: Build
        id: build
        run: |
          tools/nightly.sh "$RUNNER_TEMP/nightly"
          zip=$(ls "$RUNNER_TEMP"/nightly/tortuga.Mirlo64_nightly_*.zip)
          name=$(basename "$zip" .zip)
          rm -rf "$RUNNER_TEMP/sd" && mkdir -p "$RUNNER_TEMP/sd"
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$RUNNER_TEMP/sd"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ runner.temp }}/sd
          retention-days: 14
          if-no-files-found: error

      - name: The compile's log and reports, if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-${{ github.run_id }}
          path: |
            projects_a2_nightly.compile.log
            projects_a2_nightly/output_files/*.summary
            projects_a2_nightly/output_files/*.rpt
          retention-days: 14
          if-no-files-found: ignore
